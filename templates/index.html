<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조직도</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #f0f2f7;
      color: #1e1e2e;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e; color: #fff;
      padding: 13px 24px; display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,.25);
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; white-space: nowrap; }
    .date-group { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .date-group label { font-size: .82rem; opacity: .75; white-space: nowrap; }
    #date-input {
      padding: 5px 10px; border-radius: 6px; border: 1px solid #3a3a5a;
      background: #252545; color: #fff; font-size: .88rem; cursor: pointer;
    }
    #load-btn {
      padding: 6px 16px; background: #4f8ef7; color: #fff; border: none;
      border-radius: 6px; font-size: .88rem; cursor: pointer;
    }
    #load-btn:hover { background: #3a7de0; }

    /* ── Tabs ── */
    .tab-bar {
      display: flex; gap: 2px; padding: 10px 18px 0;
      background: #fff; border-bottom: 2px solid #dde1ef;
    }
    .tab {
      padding: 6px 16px; border-radius: 8px 8px 0 0; cursor: pointer;
      font-size: .83rem; font-weight: 600; background: #eef0f8; color: #667;
      border: 1px solid #dde1ef; border-bottom: none; user-select: none;
      display: flex; align-items: center; gap: 5px;
    }
    .tab:hover { background: #e2e6f4; }
    .tab.active { background: #fff; color: #1a1a2e; border-color: #c5ccdf; margin-bottom: -2px; }
    .badge {
      font-size: .68rem; background: #dde1ef; color: #556;
      border-radius: 10px; padding: 1px 6px;
    }
    .tab.active .badge { background: #4f8ef7; color: #fff; }

    /* ── Status ── */
    #status-bar {
      padding: 7px 22px; font-size: .78rem; color: #667;
      background: #fff; border-bottom: 1px solid #eaecf5; min-height: 32px;
    }
    #status-bar.error { color: #c02020; }

    /* ── Main ── */
    #main { padding: 20px; overflow: auto; }
    #loading { display: none; text-align: center; padding: 60px; color: #99a; }
    .spinner {
      width: 30px; height: 30px; margin: 0 auto 12px;
      border: 3px solid #dde1ef; border-top-color: #4f8ef7;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 전체: 법인별 세로 나열 ── */
    .corps-grid {
      display: flex; flex-direction: column; gap: 16px;
    }

    .corp-section {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07); overflow: hidden;
    }
    .corp-section-header {
      padding: 10px 16px; font-size: .88rem; font-weight: 700; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .corp-section-body { padding: 16px; overflow: auto; }

    /* ── Single corp ── */
    .single-wrap {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07); padding: 20px; overflow: auto;
    }

    /* ════════════════════════════════════════
       ORG CHART LAYOUT
       ════════════════════════════════════════ */

    /* Outer scroll wrapper */
    .org-scroll { overflow: auto; min-width: 0; }

    /* Root chart container: column, centered */
    .org-chart {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding-bottom: 12px;
    }

    /* ── Card ── */
    .org-card {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 8px;
      background: #fff; border: 1.5px solid #e2e6f0;
      border-left: 4px solid #94a3b8;
      white-space: nowrap; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      transition: box-shadow .12s; position: relative;
      user-select: none;
    }
    .org-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.12); }

    /* virtual (팀/파트 header) */
    .org-card.virtual {
      border-style: dashed; background: #f8f9ff; border-left-style: solid;
    }

    /* depth sizes */
    .org-card.d0 { padding: 10px 18px; font-size: .96rem; background: #f4f5ff; }
    .org-card.d1 { padding: 8px 14px;  font-size: .88rem; }
    .org-card.d2 { padding: 6px 12px;  font-size: .82rem; }
    .org-card.d3plus { padding: 5px 10px; font-size: .78rem; }

    .card-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; color: #fff;
    }
    .card-avatar.virtual-av { border-radius: 5px; width: 24px; height: 24px; }

    .card-info { display: flex; flex-direction: column; min-width: 0; }
    .card-name { font-weight: 700; color: #1e1e2e; }
    .card-role { font-size: .7rem; color: #667; margin-top: 1px; }

    .card-badges { display: flex; gap: 4px; align-items: center; flex-shrink: 0; margin-left: 2px; }
    .nbadge {
      font-size: .63rem; font-weight: 600; padding: 1px 5px; border-radius: 3px;
    }
    .note-임원     { background:#fef3c7; color:#92400e; }
    .note-육아휴직  { background:#dbeafe; color:#1e40af; }
    .note-출산휴가  { background:#fce7f3; color:#9d174d; }
    .note-퇴사예정  { background:#fee2e2; color:#991b1b; }
    .note-공석     { background:#f1f5f9; color:#64748b; border:1px solid #cbd5e1; }
    .note-other    { background:#e0f2fe; color:#0369a1; }

    .toggle-icon { font-size:.7rem; color:#bbc; margin-left:4px; transition:transform .15s; }
    .collapsed > .org-card .toggle-icon { transform: rotate(-90deg); }

    /* ── Vertical connector from card down to children ── */
    .org-vline {
      width: 2px; height: 18px;
      background: #c8d0e4; flex-shrink: 0;
    }

    /* ── Horizontal children row ── */
    .org-hrow {
      display: flex; flex-direction: row;
      align-items: flex-start; gap: 0;
    }

    /* Each column in the horizontal row */
    .org-hcol {
      display: flex; flex-direction: column; align-items: center;
      padding: 0 8px; position: relative;
    }

    /* Vertical drop line above each hcol */
    .org-hcol::before {
      content: ''; position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 2px; height: 18px; background: #c8d0e4;
    }

    /* Horizontal bar spanning siblings (drawn on ::after) */
    .org-hcol::after {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px; background: #c8d0e4;
    }
    /* First child: bar from center to right */
    .org-hrow > .org-hcol:first-child::after { left: 50%; }
    /* Last child: bar from left to center */
    .org-hrow > .org-hcol:last-child::after  { right: 50%; }
    /* Only child: no bar */
    .org-hrow > .org-hcol:only-child::after  { display: none; }

    /* Padding for the drop line height */
    .org-hcol > * { margin-top: 18px; }
    .org-hcol > *:first-child { margin-top: 18px; } /* drop line already is 18px */

    /* ── Vertical children stack ── */
    .org-vstack {
      display: flex; flex-direction: column; gap: 3px;
      margin-left: 18px; padding-left: 12px;
      border-left: 2px solid #d8ddef; margin-top: 3px;
    }
  </style>
</head>
<body>

<header>
  <h1>조직도</h1>
  <div class="date-group">
    <label for="date-input">조회기준일</label>
    <input type="date" id="date-input" value="{{ today }}">
    <button id="load-btn">조회</button>
  </div>
</header>

<div class="tab-bar" id="tab-bar">
  {% for corp in corp_order %}
  <div class="tab {% if loop.first %}active{% endif %}"
       data-corp="{{ corp }}" onclick="selectCorp('{{ corp }}')">
    {{ corp }}<span class="badge" id="badge-{{ corp }}">-</span>
  </div>
  {% endfor %}
</div>

<div id="status-bar">데이터를 불러오는 중...</div>
<div id="main">
  <div id="loading"><div class="spinner"></div>조직도 로딩 중...</div>
  <div id="chart-container"></div>
</div>

<script>
const CORP_COLORS = {
  '에임드':         '#6366f1',
  '게임베리스튜디오': '#10b981',
  '마티니':         '#f59e0b',
  '뉴플레이':       '#ef4444',
};

let currentCorp = '전체';

function selectCorp(corp) {
  currentCorp = corp;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.corp === corp)
  );
  loadOrgChart();
}

/* ── utils ── */
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function noteBadge(note) {
  if (!note) return null;
  let cls = 'note-other';
  if (note.includes('임원'))    cls = 'note-임원';
  else if (note.includes('육아휴직')) cls = 'note-육아휴직';
  else if (note.includes('출산휴가')) cls = 'note-출산휴가';
  else if (note.includes('퇴사예정')) cls = 'note-퇴사예정';
  else if (note.includes('공석'))    cls = 'note-공석';
  const span = document.createElement('span');
  span.className = `nbadge ${cls}`;
  span.textContent = note;
  return span;
}
function depthClass(d) {
  if (d === 0) return 'd0';
  if (d === 1) return 'd1';
  if (d === 2) return 'd2';
  return 'd3plus';
}

/* ── Build tree from flat list ── */
function buildTree(nodes) {
  const map = new Map();
  nodes.forEach(n => map.set(n.id, { ...n, children: [] }));
  const roots = [];
  nodes.forEach(n => {
    const node = map.get(n.id);
    if (n.parent && map.has(n.parent)) {
      map.get(n.parent).children.push(node);
    } else {
      roots.push(node);
    }
  });
  return roots;
}

/* ── Count real (non-virtual, non-겸직) members in subtree ── */
function countRealMembers(node) {
  let count = node.is_virtual ? 0 : 1;
  for (const child of node.children) {
    count += countRealMembers(child);
  }
  return count;
}

/* ── Make a card element ── */
function makeCard(node, depth, memberCount = 0) {
  const card = document.createElement('div');
  const color = node.color || '#94a3b8';
  card.className = `org-card ${depthClass(depth)} ${node.is_virtual ? 'virtual' : ''}`;
  card.style.borderLeftColor = color;

  // avatar
  const av = document.createElement('div');
  av.className = `card-avatar ${node.is_virtual ? 'virtual-av' : ''}`;
  av.style.background = color;
  av.textContent = (node.name || '?').slice(0, 1);
  card.appendChild(av);

  // info
  const info = document.createElement('div');
  info.className = 'card-info';
  const nameEl = document.createElement('div');
  nameEl.className = 'card-name';
  nameEl.textContent = node.name + (node.is_virtual && memberCount > 0 ? ` (${memberCount})` : '');
  info.appendChild(nameEl);
  if (node.role) {
    const roleEl = document.createElement('div');
    roleEl.className = 'card-role';
    roleEl.textContent = node.role;
    info.appendChild(roleEl);
  }
  card.appendChild(info);

  // badges (note + toggle)
  const badges = document.createElement('div');
  badges.className = 'card-badges';
  if (node.note) {
    const nb = noteBadge(node.note);
    if (nb) badges.appendChild(nb);
  }
  card.appendChild(badges);

  return card;
}

/* ── Recursive node renderer ──
   Layout rules:
   - depth 0  → children: HORIZONTAL
   - has virtual children → children: HORIZONTAL (팀/파트 level)
   - otherwise → children: VERTICAL (members)
*/
function renderNode(node, depth) {
  const hasChildren = node.children.length > 0;
  const hasVirtualChild = hasChildren && node.children.some(c => c.is_virtual);
  const useHorizontal = depth === 0 || hasVirtualChild || (node.is_virtual && node.children.length === 1);

  /* Outer wrapper: column, aligned to center if horizontal children, flex-start if vertical */
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.alignItems = useHorizontal ? 'center' : 'flex-start';

  /* Card */
  const memberCount = node.is_virtual ? countRealMembers(node) : 0;
  const card = makeCard(node, depth, memberCount);

  /* Collapse toggle (add icon to card if it has children) */
  if (hasChildren) {
    const tog = document.createElement('span');
    tog.className = 'toggle-icon';
    tog.innerHTML = '▾';
    card.querySelector('.card-badges').appendChild(tog);

    card.addEventListener('click', () => {
      wrap.classList.toggle('collapsed');
      childrenSection.style.display =
        wrap.classList.contains('collapsed') ? 'none' : '';
    });
  }
  wrap.appendChild(card);

  if (!hasChildren) return wrap;

  /* Children section (vline + hrow, OR vstack) */
  const childrenSection = document.createElement('div');
  childrenSection.style.display = '';

  if (useHorizontal) {
    /* Vertical line from card down to the horizontal bar */
    const vline = document.createElement('div');
    vline.className = 'org-vline';
    childrenSection.appendChild(vline);

    /* Horizontal row */
    const hrow = document.createElement('div');
    hrow.className = 'org-hrow';

    node.children.forEach(child => {
      const col = document.createElement('div');
      col.className = 'org-hcol';
      col.appendChild(renderNode(child, depth + 1));
      hrow.appendChild(col);
    });

    childrenSection.appendChild(hrow);
    childrenSection.style.display = 'flex';
    childrenSection.style.flexDirection = 'column';
    childrenSection.style.alignItems = 'center';

  } else {
    /* Vertical stack */
    const vstack = document.createElement('div');
    vstack.className = 'org-vstack';
    node.children.forEach(child => {
      vstack.appendChild(renderNode(child, depth + 1));
    });
    childrenSection.appendChild(vstack);
  }

  wrap.appendChild(childrenSection);
  return wrap;
}

/* ── Render full chart from roots ── */
function renderChart(nodes) {
  const roots = buildTree(nodes);
  const scroll = document.createElement('div');
  scroll.className = 'org-scroll';
  const chart = document.createElement('div');
  chart.className = 'org-chart';
  roots.forEach(r => chart.appendChild(renderNode(r, 0)));
  scroll.appendChild(chart);
  return scroll;
}

/* ── 전체: 4-section grid ── */
function renderSections(sections) {
  const grid = document.createElement('div');
  grid.className = 'corps-grid';
  for (const [corp, data] of Object.entries(sections)) {
    const sec = document.createElement('div');
    sec.className = 'corp-section';
    const hdr = document.createElement('div');
    hdr.className = 'corp-section-header';
    hdr.style.background = CORP_COLORS[corp] || '#6366f1';
    hdr.innerHTML = `<span>${esc(corp)}</span><span style="font-size:.76rem;opacity:.85;font-weight:400;">${data.count}명</span>`;
    sec.appendChild(hdr);
    const body = document.createElement('div');
    body.className = 'corp-section-body';
    body.appendChild(renderChart(data.nodes));
    sec.appendChild(body);
    grid.appendChild(sec);
  }
  return grid;
}

/* ── Main load ── */
async function loadOrgChart() {
  const date = document.getElementById('date-input').value;
  if (!date) return;
  const loading   = document.getElementById('loading');
  const container = document.getElementById('chart-container');
  const status    = document.getElementById('status-bar');
  loading.style.display = 'block';
  container.innerHTML   = '';
  status.className      = '';
  status.textContent    = '데이터를 불러오는 중...';

  try {
    const res  = await fetch(`/api/orgchart?date=${date}&corp=${encodeURIComponent(currentCorp)}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const counts = data.corp_counts || {};
    document.getElementById('badge-전체').textContent = data.total || 0;
    ['에임드','게임베리스튜디오','마티니','뉴플레이'].forEach(c => {
      const el = document.getElementById(`badge-${c}`);
      if (el) el.textContent = counts[c] || 0;
    });

    if (currentCorp === '전체') {
      container.appendChild(renderSections(data.sections));
      status.textContent = `${date} 기준 전체 재직자 ${data.total}명`;
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'single-wrap';
      if ((data.nodes || []).length === 0) {
        wrap.innerHTML = '<div style="text-align:center;padding:40px;color:#99a;">재직자 없음</div>';
      } else {
        wrap.appendChild(renderChart(data.nodes));
      }
      container.appendChild(wrap);
      status.textContent = `${date} 기준 ${currentCorp} 재직자 ${data.count}명`;
    }
  } catch (e) {
    status.className  = 'error';
    status.textContent = '오류: ' + e.message;
  } finally {
    loading.style.display = 'none';
  }
}

document.getElementById('date-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadOrgChart();
});
document.getElementById('load-btn').addEventListener('click', loadOrgChart);
loadOrgChart();
</script>
</body>
</html>
